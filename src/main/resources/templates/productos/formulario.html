<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 class="mb-3">Mantenimiento de Producto</h2>
    <form th:action="@{/productos/guardar}" th:object="${producto}" method="post" class="card p-4 shadow">
        <input type="hidden" th:field="*{idProd}">
        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" th:field="*{nomProd}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Precio</label>
            <input type="number" step="0.01" min="0" th:field="*{precio}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Stock actual</label>
            <input type="number" min="0" th:field="*{stockActual}" class="form-control" required>
        </div>
        <div class="d-flex justify-content-between">
            <a th:href="@{/productos}" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-success">Guardar</button>
        </div>
    </form>
</div>
</body>
</html>
