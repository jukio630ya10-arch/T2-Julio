<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle Boleta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 class="mb-3">Registrar Detalle de Boleta</h2>
    <form th:action="@{/detalle/guardar}" th:object="${detalle}" method="post" class="card p-4 shadow">
        <div class="mb-3">
            <label class="form-label">Boleta</label>
            <select class="form-select" name="nroBoleta" required>
                <option value="">Seleccione</option>
                <option th:each="b : ${boletas}" th:value="${b.nroBoleta}" th:text="${b.nroBoleta}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Producto</label>
            <select class="form-select" name="productoId" required>
                <option value="">Seleccione</option>
                <option th:each="p : ${productos}" th:value="${p.idProd}" th:text="${p.nomProd}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Cantidad</label>
            <input type="number" min="1" th:field="*{cantidad}" class="form-control" required>
        </div>
        <div class="d-flex justify-content-between">
            <a th:href="@{/boletas}" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-success">Guardar</button>
        </div>
    </form>
</div>
</body>
</html>
