<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Consulta Boleta</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <h2 class="mb-3">Lista de Boletas</h2>

    <!-- Mensajes -->
    <div th:if="${success}" class="alert alert-success"
         th:text="${success}"></div>

    <div th:if="${error}" class="alert alert-danger"
         th:text="${error}"></div>

    <table class="table table-bordered table-striped text-center">
        <thead class="table-dark">
            <tr>
                <th>N° Boleta</th>
                <th>Fecha</th>
                <th>Producto</th>
                <th>Cantidad</th>
                <th>Total</th>
                <th>Acción</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="b : ${boletas}">
                <td th:text="${b.nroBoleta}"></td>
                <td th:text="${b.fecha}"></td>

                <!-- Producto -->
                <td>
                    <span th:each="d : ${b.detalles}"
                          th:text="${d.producto.nomProd}">
                    </span>
                </td>

                <!-- Cantidad -->
                <td>
                    <span th:each="d : ${b.detalles}"
                          th:text="${d.cantidad}">
                    </span>
                </td>

                <td th:text="${b.total}"></td>

                <td>
                    <a th:href="@{/boletas/editar/{id}(id=${b.nroBoleta})}"
                       class="btn btn-warning btn-sm">
                        Actualizar
                    </a>
                </td>
            </tr>
        </tbody>
    </table>

</div>

</body>
</html>
