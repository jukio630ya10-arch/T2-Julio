<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mantenimiento Boleta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 class="mb-3">Actualizar Boleta</h2>

    <form th:action="@{/boletas/actualizar}" method="post" class="card p-4 shadow">
        <input type="hidden" name="nroBoleta" th:value="${boleta.nroBoleta}"/>

        <div class="mb-3">
            <label class="form-label">Fecha</label>
            <input type="date" name="fecha" th:value="${boleta.fecha}" class="form-control" required/>
        </div>

        <div class="mb-3">
            <label class="form-label">Cliente</label>
            <input type="text" name="nomCliente" th:value="${boleta.nomCliente}" class="form-control" required/>
        </div>

        <div class="mb-3">
            <label class="form-label">Estado</label>
            <input type="text" name="estado" th:value="${boleta.estado}" class="form-control" required/>
        </div>

        <div class="mb-3">
            <label class="form-label">Producto</label>
            <select class="form-select" name="productoId" required>
                <option value="">Seleccione</option>
                <option th:each="p : ${productos}"
                        th:value="${p.idProd}"
                        th:text="${p.nomProd}"
                        th:selected="${detalle.producto != null and detalle.producto.idProd == p.idProd}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Cantidad</label>
            <input type="number" name="cantidad" min="1" class="form-control" th:value="${detalle.cantidad}" required/>
        </div>

        <div class="d-flex justify-content-between">
            <a th:href="@{/boletas}" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-success">Actualizar</button>
        </div>
    </form>
</div>
</body>
</html>
