<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mantenimiento Boleta</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <h2 class="mb-3">Actualizar Boleta</h2>

    <form th:action="@{/boletas/procesar}"
          th:object="${boleta}"
          method="post"
          class="card p-4 shadow">

        <!-- ID oculto -->
        <input type="hidden" th:field="*{nroBoleta}" />

        <div class="mb-3">
            <label class="form-label">Fecha</label>
            <input type="date"
                   th:field="*{fecha}"
                   class="form-control"/>
        </div>

        <div class="mb-3">
            <label class="form-label">Cliente</label>
            <input type="text"
                   th:field="*{nomCliente}"
                   class="form-control"/>
        </div>

        <div class="mb-3">
            <label class="form-label">Estado</label>
            <input type="text"
                   th:field="*{estado}"
                   class="form-control"/>
        </div>

        <!-- COMBO PRODUCTO -->
        <div class="mb-3">
            <label class="form-label">Producto</label>
            <select class="form-select" name="productoId">
                <option value="">Seleccione</option>
                <option th:each="p : ${productos}"
                        th:value="${p.idProd}"
                        th:text="${p.nomProd}">
                </option>
            </select>
        </div>

        <div class="d-flex justify-content-between">
            <a th:href="@{/boletas}"
               class="btn btn-secondary">
                Cancelar
            </a>

            <button type="submit"
                    class="btn btn-success">
                Procesar
            </button>
        </div>

    </form>

</div>

</body>
</html>
